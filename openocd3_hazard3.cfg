# OpenOCD configuration for Hazard3 RISC-V processor via jtag_vpi
# Save as: openocd_hazard3.cfg
# Usage: openocd -f openocd_hazard3.cfg

# Use remote_bitbang to connect to the simulation
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 5555

# Define the JTAG TAP
# IR length is 5 bits (standard RISC-V DTM)
# IDCODE should match the one in example_soc.v (0xdeadbeef)
jtag newtap hazard3 cpu -irlen 5 -expected-id 0xdeadbeef

# Create the RISC-V target
set _TARGETNAME hazard3.cpu
target create $_TARGETNAME riscv -chain-position hazard3.cpu

# Disable virtual address translation for now
riscv virt2phys_mode off

# Set command timeout (useful for slow simulations)
riscv set_command_timeout_sec 2000

# Memory regions (adjust based on your SoC memory map)
# SRAM: 0x00000000 - 0x0001FFFF (128 kB)
# Peripherals: 0x40000000+

# Initialize the debug system
init

# Optional: Configure GDB
gdb_port 3333
gdb_memory_map enable
gdb_breakpoint_override hard

# Telnet port for OpenOCD commands
telnet_port 4444

echo "========================================="
echo "Hazard3 JTAG Debug Interface Ready"
echo "========================================="
echo "Telnet: telnet localhost 4444"
echo "GDB:    target extended-remote localhost:3333"
echo "========================================="

# Optional: Halt on connection (comment out if you want free-running)
# halt

# Optional: Load a program (uncomment and adjust path)
# load_image your_program.elf
# resume 0x00000000
