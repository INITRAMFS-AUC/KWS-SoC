# 1. Interface Configuration
# Use CMSIS-DAP adapter
adapter driver cmsis-dap

# Select JTAG transport (RISC-V usually uses JTAG, not SWD)
transport select jtag

# Set adapter speed (1MHz is a safe starting point)
adapter speed 10

# 2. Chip Configuration
set _CHIPNAME hazard3

# Declare the TAP.
# Note: RISC-V usually has an IR length of 5.
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu

# Create the target
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# 3. Memory Configuration
# Ensure 0x00000000 is actually RAM on your physical silicon.
# In simulation (CXXRTL), RAM is often at 0x0, but on physical chips
# this might be Flash/ROM. If this fails, check your SoC memory map.
if { [info exists ::env(SRAM_DEPTH)] } {
    set _SRAM_DEPTH $::env(SRAM_DEPTH)
} else {
    set _SRAM_DEPTH 32768
}

set _WORK_AREA_SIZE [expr {$_SRAM_DEPTH * 4}]

$_TARGETNAME configure -work-area-phys 0x00000000 -work-area-size $_WORK_AREA_SIZE -work-area-backup 0


riscv set_command_timeout_sec 60

# 4. GDB Configuration
gdb report_data_abort enable
gdb memory_map enable
gdb flash_program enable

# 5. Initialization
init
halt
